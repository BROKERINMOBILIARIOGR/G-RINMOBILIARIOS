name: Actualizar noticias de vivienda
on:
  schedule:
    - cron: "0 11 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/actualizar-noticias.yml"
      - "scripts/actualizar_noticias.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-noticias
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el sitio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recoger titulares RSS
        run: python scripts/actualizar_noticias.py
      - name: Publicar titulares nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/noticias.json compartir/noticias
          if git diff --cached --quiet; then
            echo "No hay cambios en los titulares."
          else
            git commit -m "Actualizar noticias de vivienda"
            git push
          fi
