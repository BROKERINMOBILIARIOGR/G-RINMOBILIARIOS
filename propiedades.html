<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Propiedades en venta</title>

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/propiedades.css">
<script src="js/propiedades.js" defer></script>
</head>

<body>

<!-- =========================
     HERO
========================= -->
<header class="hero">

    <video autoplay muted loop playsinline class="video-fondo">
        <source src="video/videoplayback.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <div class="hero-content">

        <div class="logo-titulo">
            <img src="logo.jpeg" class="logo">
            <h1>Propiedades en venta</h1>
        </div>

        <p>Encuentra tu inmueble ideal</p>

        <nav class="menu-hero">
            <a href="index.html">Inicio</a>
            <a href="proyectos.html">Proyectos</a>
            <a href="propiedades.html">Propiedades</a>
            <a href="vende.html">Vende</a>
            <a href="contacto.html">Contacto</a>
        </nav>

    </div>

</header>

<!-- =========================
     BUSCADOR
========================= -->
<section class="buscador">

    <h2>Encuentra tu propiedad</h2>

    <div class="buscador-card">

        <div class="grid-filtros">

            <!-- Departamento -->
           <select name="departamento" id="departamento">
    <option value="">Departamento</option>

    <option value="amazonas">Amazonas</option>
    <option value="antioquia">Antioquia</option>
    <option value="arauca">Arauca</option>
    <option value="atlantico">Atlántico</option>
    <option value="bolivar">Bolívar</option>
    <option value="boyaca">Boyacá</option>
    <option value="caldas">Caldas</option>
    <option value="caqueta">Caquetá</option>
    <option value="casanare">Casanare</option>
    <option value="cauca">Cauca</option>
    <option value="cesar">Cesar</option>
    <option value="choco">Chocó</option>
    <option value="cordoba">Córdoba</option>
    <option value="cundinamarca">Cundinamarca</option>
    <option value="guainia">Guainía</option>
    <option value="guaviare">Guaviare</option>
    <option value="huila">Huila</option>
    <option value="la_guajira">La Guajira</option>
    <option value="magdalena">Magdalena</option>
    <option value="meta">Meta</option>
    <option value="narino">Nariño</option>
    <option value="norte_santander">Norte de Santander</option>
    <option value="putumayo">Putumayo</option>
    <option value="quindio">Quindío</option>
    <option value="risaralda">Risaralda</option>
    <option value="san_andres">San Andrés y Providencia</option>
    <option value="santander">Santander</option>
    <option value="sucre">Sucre</option>
    <option value="tolima">Tolima</option>
    <option value="valle_cauca">Valle del Cauca</option>
    <option value="vaupes">Vaupés</option>
    <option value="vichada">Vichada</option>

</select>

            <!-- Ciudad -->
            <input type="text" id="ciudad" placeholder="Ciudad">

            <!-- Tipo -->
            <select id="tipo">
                <option value="">Tipo</option>
                <option value="Casa">Casa</option>
                <option value="Apartamento">Apartamento</option>
                <option value="Lote">Lote</option>
                <option value="Finca">Finca</option>
                <option value="Bodega">Bodega</option>
                <option value="Local">Local comercial</option>
            </select>

            <!-- Precio -->
            <input type="number" id="precioMax" placeholder="Precio máximo">

        </div>

        <button onclick="filtrarPropiedades()">Buscar</button>

    </div>

</section>

<!-- =========================
     PROPIEDADES
========================= -->
<section>
    <p id="estadoPropiedades" class="estado-propiedades" role="status">Cargando propiedades…</p>
    <div class="grid-propiedades" id="listaPropiedades">
    </div>

</section>

<footer>
    © Broker Inmobiliario G&amp;R
    <div class="contador-visitas" aria-live="polite">👀 Visitas: <span id="visitas">Cargando…</span></div>
</footer>
<script type="module" src="js/contador-visitas.js"></script>
</body>
</html>
