<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyectos | Broker Inmobiliario G&amp;R</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/proyectos.css">
</head>
<body>
  <header class="hero">
    <video autoplay muted loop playsinline class="video-fondo">
      <source src="video/videoplayback.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>
    <div class="hero-content">
      <div class="logo-titulo">
        <img src="logo.jpeg" class="logo" alt="Logo Broker Inmobiliario G&amp;R">
        <h1>Proyectos Inmobiliarios</h1>
      </div>
      <p>Explora nuestras oportunidades de inversión</p>
      <nav class="menu-hero">
        <a href="index.html">Inicio</a>
        <a href="proyectos.html">Proyectos</a>
        <a href="propiedades.html">Propiedades</a>
        <a href="vende.html">Vende</a>
        <a href="contacto.html">Contacto</a>
      </nav>
    </div>
  </header>

  <main>
    <section aria-labelledby="titulo-lista-proyectos">
      <h2 id="titulo-lista-proyectos">Nuestros proyectos</h2>
      <div id="lista-proyectos" class="grid-proyectos" aria-live="polite"></div>
      <p id="mensaje-proyectos" class="mensaje-proyectos" role="status"></p>
    </section>
  </main>

  <dialog class="modal-proyecto" id="detalle-proyecto" aria-labelledby="detalle-titulo">
    <div class="modal-contenido">
      <button class="modal-cerrar" id="cerrar-detalle" type="button" aria-label="Cerrar ventana">×</button>
      <div id="detalle-imagenes" class="detalle-imagenes"></div>
      <p class="modal-precio" id="detalle-precio"></p>
      <h2 id="detalle-titulo"></h2>
      <p id="detalle-ubicacion"></p>
      <p id="detalle-descripcion" class="detalle-descripcion"></p>
      <ul id="detalle-caracteristicas"></ul>
    </div>
  </dialog>

  <footer>
    © Broker Inmobiliario G&amp;R
    <a class="enlace-trabajadores" href="https://CONFIGURA-TU-EQUIPO.ts.net/admin/">Acceso de trabajadores</a>
  </footer>

  <script src="js/proyectos.js" defer></script>
</body>
</html>
